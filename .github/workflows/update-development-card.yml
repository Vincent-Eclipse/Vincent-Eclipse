name: Update development card

on:
  schedule:
    - cron: '17 5 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-development-card
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Vincent-Eclipse/Vincent-Eclipse'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate development card
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: Vincent-Eclipse
        run: node scripts/generate-profile.mjs

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- generated/development.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated card
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- generated/development.svg
          git commit -m "chore: update development card"
          git push
